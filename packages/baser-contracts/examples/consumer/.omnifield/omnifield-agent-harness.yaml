# Плагин агент-харнесса — настройки обвеса omnifield/agent-harness.
#
# ОДИН ФАЙЛ, ДВА ЧИТАТЕЛЯ. Ключ `baser` зарезервирован: его читает дверь. Всё
# остальное принадлежит самому инструменту, и дверь этого не открывает —
# конфликта нет, потому что пишет в файл человек, а не два поставщика.

baser:
  settings:
    # Зоны продукта: под каждую поднимается своя owner-сессия.
    zones:
      - contracts
      - materialize
      - cli

    # Сколько архитекторов (main-сессий) у продукта.
    # architects: 1

# ── дальше — дело самого плагина; дверь сюда не смотрит ──────────────────────
services:
  tasker: http://10.8.1.1:8080/api/tasker
  knowledger: http://10.8.1.1:8080/api/knowledger
