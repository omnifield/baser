# Девбокс: проект целиком в контейнере — настройки обвеса omnifield/devbox.
#
# Имя файла считается из личности обвеса: omnifield/devbox → omnifield-devbox.yaml.
# Ссылки на него в baser.json нет намеренно — второе место для одного факта могло бы
# разъехаться, а правило разъехаться не может.
#
# Файл рождает дверь один раз, если его нет: с закомментированными дефолтами и
# описаниями. Значений она не пишет никогда — заполняет их человек, и заполненное
# не поднимается, потому что движку писать сюда некуда.

baser:
  # Ходовое положение регулировок. Следующий пресет бьёт предыдущего.
  presets:
    - omnifield

  settings:
    # Ничего не заполнено — и это рабочее состояние: НОЛЬ ВОПРОСОВ ПОЛЬЗОВАТЕЛЮ.
    # Раскомментируй строку, чтобы значение перестало ездить за выпусками обвеса.

    # Версия Node в образе. Пин, поставленный при выпуске обвеса.
    # runtimeVersion: '24'

    # Команда установки зависимостей.
    # installCommand: pnpm install --frozen-lockfile
