# Фикстура «файл, который дальше ведёт человек» — настройки обвеса fixture/seed.
#
# Имя файла считается из личности: fixture/seed → fixture-seed.yaml. Оба файла
# настроек лежат в одной папке — человек ходит в одно место (`kb:BASER2-2` §4).

baser:
  settings:
    # Заполнено человеком: это значение бьёт дефолт обвеса (пустой список) и не
    # поднимается никогда — движку писать сюда некуда.
    areas:
      - form
      - probe
      - door
