# Настройки обвеса omnifield/devbox для этого репозитория.
# Дверь рождает этот файл один раз с закомментированными дефолтами; значения — наши.
# Всё вне ключа `baser` принадлежит самому инструменту, дверь туда не смотрит.
baser:
  settings:
    # Тег образа. Наш девбокс сегодня на 22; дефолт обвеса уехал на 24 — подъём
    # версии рантайма это отдельное решение, а не побочный эффект перевода на станок.
    imageTag: '22'
    # Ассистент ставится в контейнер (kb:FUND-4) — у нас он есть и был.
    installAssistant: true
    # Peer-alias в общей сети: соседи (tasker, knowledger, verdaccio) видны по имени.
    network: omnifield-gateway
    # Общие на машине тома: одни креды и один стор на все omnifield-девбоксы.
    secretsVolume: omnifield-secrets
    pnpmStoreVolume: omnifield-pnpm-store
