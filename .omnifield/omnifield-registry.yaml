# Что эта постройка отгружает на склад своей локации — @baser/registry.
#
# Решения лежат в схеме и потому переживают пересоздание контейнера; склад,
# процесс и порт лежат на участке и потому переживают остановку. Одно другое
# не подменяет (kb:WORLD-34, tasker:BASER2-273).
#
# Файл ваш: инструмент его читает и никогда в него не пишет.

# Магазин локации этой постройке нужен: она и производит товар, и ставит из него.
shop: true

# ПАРТИЯ — что именно уезжает на склад. Пути от корня постройки.
batch:
  - packages/baser-check
  - packages/baser-cli
  - packages/baser-contracts
  - packages/baser-devbox
  - packages/baser-git
  - packages/baser-materialize
  - packages/baser-pack
  - packages/baser-registry
  - packages/baser-release

# Куда. Наружу отсюда не уезжает ничего: общий магазин комьюнити — отдельные
# три действия, и они ещё не построены.
address: location
