# Git-обвязка: гейт заголовка PR — настройки обвеса omnifield/git.
#
# Файл родила консоль, потому что его здесь не было. Дальше он твой: консоль
# в него не пишет НИКОГДА, поэтому заполненное не поднимается за выпусками
# обвеса — писать сюда некому, кроме тебя.
#
# Имя файла считается из личности обвеса (omnifield/git); ссылки на него в
# baser.json нет намеренно — правило разъехаться не может, ссылка могла бы.
#
# Ключ "baser" читает консоль. Всё, что вне него, принадлежит самому
# инструменту, и консоль этого не открывает.

baser:
  # Пресетов обвес не объявлял.

  settings:
    # Ничего не заполнено, и это рабочее состояние: вопросов консоль не задаёт.
    # Раскомментируй значение — и оно перестанет ездить за выпусками обвеса.
    # Значение из НЕСКОЛЬКИХ строк (карта, список) снимается блоком целиком:
    # с одной первой строки останется ключ без значения, то есть null, а с
    # одной вложенной — отступ, которому не к чему относиться.

    # Версия Node, на которой бежит гейт
    # Мажор, который ставит setup-node в джобе гейта. Гейт zero-deps — установки зависимостей в его джобе нет, поэтому от версии зависит только сам запуск правила, а не сборка локации. Дефолт — Active LTS на дату выпуска обвеса.
    # nodeVersion: "22"

    # Зона в заголовке обязательна
    # true — заголовок без скобок отвергается: по зоне видно, чьё изменение, и это правило строже спецификации Conventional Commits, где зона необязательна. false — заголовок без зоны годен, форма остальным правилам подчиняется по-прежнему. Настройка булева, а не «зона обязательна, если перечень зон задан»: два разных решения (обязательна ли зона и закрыт ли их перечень) склеились бы в одно, и выключить первое стало бы нельзя, не выключив второе.
    # titleScopeRequired: true

    # Закрытый перечень зон
    # Заполнен — зона в заголовке обязана быть ИЗ этого списка, и подсказка гейта называет его целиком. Пусто (дефолт) — перечень открыт: годится любая зона по форме (строчные латинские, цифры и дефис), и подсказка никаких имён не выдумывает. Открытый перечень — рабочее состояние, а не пробел: локация, у которой зоны ещё не устоялись, получает форму без выдуманного списка.
    # titleScopes: null

    # Типы, признаваемые в заголовке PR
    # Список закрытый намеренно: незнакомый тип считалка версий молча пропускает мимо выпуска, а не отвергает, — и правка уезжает в главную, не подняв номер. Дефолт — набор Conventional Commits, который признают ходовые считалки версий. Свой набор ЗАМЕНЯЕТ дефолт целиком: тип, которого нет в списке, гейт отвергнет с перечнем допустимых.
    # titleTypes:
    #   - feat
    #   - fix
    #   - chore
    #   - docs
    #   - test
    #   - refactor
    #   - perf
    #   - build
    #   - ci
    #   - revert
