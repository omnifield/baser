name: CI
on:
  push:
    branches: [main]
  pull_request:

# `packages: read` — с 2026-08-02 мы САМИ потребитель приватного пакета: обвес
# агент-харнесса (`@omnifield/brainer-harness`) объявлен в `baser.json` и ставится
# как обычная зависимость. Без этого права и без npmrc установка в CI отвечает
# `ERR_PNPM_FETCH_401`, причём в тексте видно, что заголовок авторизации не ставился
# вовсе — то есть чинится это у нас, а не грантом на той стороне.
permissions:
  contents: read
  packages: read

# Гейт заголовка PR стоял здесь до `tasker:BASER2-184` и уехал в `pr-title.yml`.
# Причина — события: типы задаются на весь workflow, а гейту нужен `edited`
# (правка заголовка), которого нет среди умолчаний. Оставь он тут — каждая правка
# заголовка гоняла бы и `main` с установкой, сборкой и пробами.

jobs:
  # Номер выпуска обязан называть цену изменения. На нулевых мажорах `nx release`
  # поднимает патч и фиче, и ломающему (проверено прогоном 2026-08-01), поэтому
  # бамп назначается руками — а гейт держит то, что дисциплине не отдают:
  # ломающее с прошлого тега не уедет в реестр патчем (`tasker:BASER2-95`).
  #
  # Нужна ВСЯ история и теги: база сравнения — тег последнего выпуска пакета.
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Гейт живёт в пакете `@omnifield/baser-release` — он инструмент продукта, а
      # не скрипт репозитория (`tasker:BASER2-158`). Форма джоба от переезда не
      # меняется: инструмент zero-deps и не собирается, поэтому установки
      # зависимостей здесь по-прежнему нет — отсюда его секунды и независимость
      # от реестра с токенами.
      - run: node packages/baser-release/bin/release-guard.mjs

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # Приватный scope `@omnifield` в GitHub Packages требует токен ДАЖЕ на чтение —
      # это свойство сервиса, а не наша настройка (см. README, «Где брать пакеты»).
      # Токен кладётся в npmrc ПОЛЬЗОВАТЕЛЯ (HOME), а не репозитория: npmrc в корне
      # репозитория виден каждой пробе, которая запускает npm из своей фикстуры, и
      # зона девбокса на нём краснеет — её проверки строят «реестр не настроен» сами.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@omnifield'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Готовность — ОДНА команда, ровно та же, что у вахтёра на выходе
      # (машинный `pre-commit`) и у владельца зоны на его машине: `pnpm verify` =
      # `nx run-many -t test typecheck build --skip-nx-cache`.
      #
      # До `tasker:BASER2-191` приёмка гоняла свой набор шагов, и зелёное у себя не
      # значило зелёное здесь. Замер на одном коммите (2026-08-06): `pnpm verify` —
      # exit 0, 1151 проба зелёная; корневой `pnpm exec vitest run` — exit 1, 169
      # упавших из тех же проб. Набор ФАЙЛОВ у команд был одинаковый, различалась
      # только конфигурация: корневой прогон бежал БЕЗ проектных конфигов вовсе
      # (`vitest.workspace.ts` vitest 4 больше не читает, у нас 4.1.10), то есть без
      # `globalSetup` и таймаутов зоны `cli`. Сверять два набора post-factum незачем —
      # расхождению неоткуда взяться там, где команда одна.
      #
      # Что эта строка держит помимо одинаковости:
      # · пробы ПОСЛЕ сборки — порядок держит сам nx (`targetDefaults.test.dependsOn:
      #   ["^build"]`): зона импортирует соседей по их публичной поверхности (`dist`),
      #   и без сборки они не резолвятся;
      # · run-many, а не affected: affected на squash-мерже способен не увидеть зону,
      #   которую задел сосед, а девять проектов собираются за секунды;
      # · пробы зоны `git` бегут здесь же — nx видит `.github` проектом по его
      #   `project.json` (`tasker:BASER2-167`), поэтому отдельный шаг для них был бы
      #   дублем, а не страховкой;
      # · прогон заканчивается сам: у @nx/vitest дефолт — watch, но во всех восьми
      #   конфигах проб стоит `watch: false` (замер 2026-08-06: 33 секунды до exit 0).
      - run: pnpm verify
