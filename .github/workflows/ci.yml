name: CI
on:
  push:
    branches: [main]
  pull_request:

# `packages: read` — с 2026-08-02 мы САМИ потребитель приватного пакета: обвес
# агент-харнесса (`@omnifield/brainer-harness`) объявлен в `baser.json` и ставится
# как обычная зависимость. Без этого права и без npmrc установка в CI отвечает
# `ERR_PNPM_FETCH_401`, причём в тексте видно, что заголовок авторизации не ставился
# вовсе — то есть чинится это у нас, а не грантом на той стороне.
permissions:
  contents: read
  packages: read

jobs:
  # Заголовок PR — это и есть сообщение коммита в `main`: мержим сквошем, и в историю
  # уходит заголовок, а не коммиты внутри ветки. Дважды за 2026-07-29 туда уехало
  # «Feat/form v2», унеся с собой в том числе пометку ломающего изменения.
  #
  # Цена не косметическая: `nx.json` включает `version.conventionalCommits`, то есть
  # версии и changelog выводятся из заголовков. Заголовок без типа не поднимет версию,
  # а `!` внутри тела сквоша не сделает мажор (`tasker:BASER2-66`).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Заголовок PR — по Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|test|refactor|perf|build|ci|revert)\([a-z0-9-]+\)!?: .+'; then
            echo "Заголовок в порядке: $TITLE"
            exit 0
          fi
          echo "::error::Заголовок PR не по Conventional Commits: «$TITLE»"
          echo ""
          echo "Мы мержим сквошем — этот заголовок станет коммитом в main, и по нему"
          echo "nx release выводит версию и changelog. Без типа и зоны изменение"
          echo "останется невидимым для выпуска, а ломающее не поднимет мажор."
          echo ""
          echo "Форма: <тип>(<зона>): <что сделано> — например"
          echo "  feat(materialize): класс артефакта в паспорте укладки (BASER2-51)"
          echo "  fix(cli): дверь не сочиняет версию, которой обвес не назвал"
          echo "  chore(harness): адрес сервисов через VPN-контур"
          echo ""
          echo "Ломающее изменение помечается восклицательным знаком: feat(devbox)!: ..."
          echo "Типы: feat · fix · chore · docs · test · refactor · perf · build · ci · revert"
          echo "Зона обязательна — по ней видно, чьё изменение."
          exit 1

  # Номер выпуска обязан называть цену изменения. На нулевых мажорах `nx release`
  # поднимает патч и фиче, и ломающему (проверено прогоном 2026-08-01), поэтому
  # бамп назначается руками — а гейт держит то, что дисциплине не отдают:
  # ломающее с прошлого тега не уедет в реестр патчем (`tasker:BASER2-95`).
  #
  # Нужна ВСЯ история и теги: база сравнения — тег последнего выпуска пакета.
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release-guard.mjs

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Приватный scope `@omnifield` в GitHub Packages требует токен ДАЖЕ на чтение —
      # это свойство сервиса, а не наша настройка (см. README, «Где брать пакеты»).
      # Пишем npmrc до установки: `setup-node` с `registry-url` кладёт его в HOME, а
      # pnpm в CI читает конфиг репозитория, и первым же выигрывает он.
      - run: |
          printf '%s\n' \
            '@omnifield:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # run-many, а не affected: проектов четыре и они собираются за секунду, а affected
      # на squash-мерже способен не увидеть зону, которую задел сосед.
      - run: pnpm exec nx run-many -t typecheck build
      # Тесты идут ПОСЛЕ сборки всех пакетов: зона импортирует соседей по их публичной
      # поверхности (`dist`), и без сборки они не резолвятся. Локально это незаметно —
      # там dist лежит с прошлых прогонов, и зелень держится на устаревших артефактах.
      # Не `nx -t test`: у @nx/vitest дефолт — watch-режим, в CI он не заканчивается.
      - run: pnpm exec vitest run
