name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # run-many, а не affected: проектов четыре и они собираются за секунду, а affected
      # на squash-мерже способен не увидеть зону, которую задел сосед.
      - run: pnpm exec nx run-many -t typecheck build
      # Тесты идут ПОСЛЕ сборки всех пакетов: зона импортирует соседей по их публичной
      # поверхности (`dist`), и без сборки они не резолвятся. Локально это незаметно —
      # там dist лежит с прошлых прогонов, и зелень держится на устаревших артефактах.
      # Не `nx -t test`: у @nx/vitest дефолт — watch-режим, в CI он не заканчивается.
      - run: pnpm exec vitest run
