name: Release
# Ручной deliberate-publish (не авто-на-push). Реестр — публичный npm (kb:ADR-19),
# OIDC trusted publishing + provenance (kb:MECH-7). Требует настроенного на npmjs.com
# trusted publisher для scope @omnifield ↔ этот репо+workflow.
#
# ПОРЯДОК ШАГОВ ЗДЕСЬ НЕСУЩИЙ, а не оформительский. Наружу уезжает то, что лежит
# в манифестах, а лежит там ВНУТРЕННЕЕ имя (`@baser/*`); публичное — другое
# (`@omnifield/baser-*`, kb:MECH-15). Значит между «собрано» и «опубликовано»
# обязан стоять шаг переименования, а после публикации — приёмка, судящая
# уехавшее. Разбор целиком — в `PIPELINE.md`.
#
#   готовность → карта имён → версии и тег → ПЕРЕИМЕНОВАНИЕ → публикация →
#   запись в main → ПРИЁМКА из публичного реестра
#
# Красный любого шага обрывает джоб, поэтому публикация физически недостижима
# без зелёных карты и переименования (`tasker:BASER2-263`).
on:
  workflow_dispatch:

permissions:
  contents: write # commit версий/changelog + git tag
  id-token: write # OIDC trusted publishing (без долгоживущего NPM_TOKEN)

# Два стабильных выпуска разом — гонка за один номер. Очередь, а не отмена, и
# по той же причине, что в дев-канале: прогон, который уже мог что-то
# опубликовать, снимать посреди работы нельзя. Снятый на публикации прогон
# оставляет ту же неопределённость, что упавший, — её и разбирает шаг отказа
# ниже (`tasker:BASER2-192`).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing требует npm >= 11.5.1 (node 22 несёт npm 10.x)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # КЕМ ПОДПИСАН КОММИТ ВЕРСИЙ. `nx release` делает `git commit` и `git tag`
      # сам и автора не передаёт — берёт его из настроек репозитория. У раннера
      # их нет: `actions/checkout` личность не выставляет, и без этих двух строк
      # поток падал бы ровно на коммите версий. Личность — штатный бот Actions,
      # чтобы коммит выпуска не выглядел сделанным человеком.
      - name: Кем подписан коммит версий
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # ГОТОВНОСТЬ ПЕРЕД ПУБЛИКАЦИЕЙ — та же ОДНА команда, что у вахтёра на
      # выходе (машинный `pre-commit`) и у приёмки (`ci.yml`): `pnpm verify` =
      # `node .github/scripts/verify.mjs` — снос памяти `tsc` и тот же набор
      # целей `nx` (почему не голая строка — `tasker:BASER2-219`, разбор в
      # `PIPELINE.md`). Здесь прогон и так холодный, снос снимает ноль файлов;
      # ценность в том, что команда осталась ОДНА и там, где тепло.
      #
      # До `tasker:BASER2-192` этого шага здесь не было вовсе: стабильный выпуск
      # собирал и публиковал, не прогнав ни одной пробы.
      #
      # ПОЧЕМУ ИМЕННО ЗДЕСЬ. Позже нельзя: после публикации проверка судит то,
      # что уже уехало, а уехавшее не отзывается — номер занят навсегда
      # (политика unpublish npm, сверено 2026-08-06). Раньше нельзя: пробам
      # нужны зависимости, поставленные шагом выше.
      #
      # ПОЧЕМУ ТА ЖЕ КОМАНДА, А НЕ СВОЙ НАБОР ДЛЯ ВЫПУСКА. Свой набор проверок у
      # выпускного потока — ровно та щель, которую закрыл `tasker:BASER2-191`:
      # вердикт «готово» обязан значить одно и то же везде, иначе зелёное на PR
      # ничего не обещает выпуску.
      #
      # BUILD-BEFORE-PUBLISH ОТСЮДА НЕ ПРОПАЛ, а вошёл сюда: `verify` собирает
      # всё явной целью `build` и без кэша, то есть публикуется свежесобранное
      # ЭТИМ прогоном. Полагаться на publish-хук по-прежнему нельзя (BASER-1 #1:
      # dependsOn ненадёжен) — и мы на него и не полагаемся.
      - run: pnpm verify

      # КАРТА ИМЁН СПРАШИВАЕТСЯ ПЕРВОЙ ИЗ НЕОБРАТИМОГО — и это её место, а не
      # удобство. Объявляет её зона `release` (одна карта на репозиторий,
      # `tasker:BASER2-262`); неполная или противоречивая карта — код 1 и пустой
      # stdout, потому что половина карты хуже её отсутствия: по ней доезжают до
      # `npm publish`.
      #
      # Спросить её ПОЗЖЕ было бы дороже ровно на цену версий и тега: красный
      # здесь не оставляет за собой ничего, красный после версий — коммит и тег
      # выпуска, которого не было.
      - name: Карта публичных имён
        id: names
        run: node packages/baser-release/bin/release-names.mjs > "$RUNNER_TEMP/public-names.json"

      # ВЕРСИИ, CHANGELOG И ТЕГ — ПОД ВНУТРЕННИМИ ИМЕНАМИ. Репозиторий живёт
      # внутренними именами, и тег выпуска тоже (`{projectName}@{version}`):
      # переименуй дерево раньше — и коммит с тегом уехали бы в `main` под
      # публичными именами, а гейт номеров и объявление прежних имён потеряли бы
      # историю.
      #
      # `--skip-publish`, а не `--yes`: публикация вынесена отдельным шагом,
      # потому что между ней и этим шагом обязано стоять переименование. `--yes`
      # здесь опубликовал бы ВНУТРЕННИЕ имена — наружу и навсегда.
      - name: Версии, changelog и тег — под внутренними именами
        id: version
        run: pnpm exec nx release --skip-publish

      # ПЕРЕИМЕНОВАНИЕ ПЕРЕД ПУБЛИКАЦИЕЙ. Манифесты и спецификаторы в
      # поставляемом переписываются на публичные имена, `workspace:*` становится
      # номером соседа. Пакет без записи в карте — отказ ДО реестра (код 1), а
      # не «оставим как есть»: он уехал бы под внутренним именем, то есть
      # случился бы ровно тот дефект, ради которого шаг существует.
      #
      # ДЕРЕВО ПОСЛЕ ЭТОГО ШАГА ПУБЛИКУЕМОЕ, НО НЕ КОММИТИМОЕ. Ничего из
      # переписанного в `main` не уезжает: коммит версий сделан выше, а `git
      # push` ниже везёт коммиты, а не рабочее дерево.
      #
      # Отчёт шага (stdout) читает приёмка: что именно уехало наружу, знает он.
      - name: Переименование перед публикацией
        id: rename
        run: node .github/scripts/public-rename.mjs --names "$RUNNER_TEMP/public-names.json" > "$RUNNER_TEMP/public-rename.json"

      # Публикация уже переименованного. `id` — чтобы шаг отказа читал рубеж из
      # состояния ЭТОГО шага, а не из отметок, которые поток ставил бы себе сам.
      - name: Публикация в публичный npm
        id: publish
        run: pnpm exec nx release publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # ЗАПИСЬ В `main` ИДЁТ РАНЬШЕ ПРИЁМКИ, И ЭТО НЕ ПОРЯДОК УДОБСТВА. После
      # успешной публикации самое дорогое из оставшегося — расхождение реестра с
      # репозиторием: номера заняты, а история про них молчит, и гейт номеров на
      # PR начинает мерять цену изменения не от того выпуска. Красная приёмка
      # этого не отменяет и ничего не откатывает — значит запись идёт первой, а
      # приёмка выносит вердикт о выпуске, который уже состоялся.
      - name: Репозиторий узнаёт о выпуске
        id: push
        run: git push --follow-tags origin HEAD:main

      # ПРИЁМКА СУДИТ УЕХАВШЕЕ — установкой из публичного реестра в чистое место
      # на холодном кэше, а не сборкой у себя (`tasker:BASER2-263`, образец —
      # `tasker:BASER2-251`: выпуск, зелёный в монорепе целиком, падал у
      # потребителя на первой же команде). Всё, что стоит выше, судит рабочее
      # дерево; потребитель не получает из него ничего.
      #
      # Сводка идёт в отчёт прогона, а не только в лог: вердикт «выпуск у
      # потребителя не работает» читают не в тот же час, когда он вынесен.
      - name: Приёмка — установка выпущенного из публичного реестра
        id: acceptance
        run: node .github/scripts/public-acceptance.mjs --report "$RUNNER_TEMP/public-rename.json" >> "$GITHUB_STEP_SUMMARY"

      # ОТКАЗ НАЗЫВАЕТ СОСТОЯНИЕ РЕЕСТРА, а не только причину падения. Красный
      # шаг отвечает на «почему встали» — это видно в логе. Дорогой вопрос у
      # выпуска другой: уехало ли что-нибудь, — и ответ на него зависит от того,
      # где встали. Суждение живёт в скрипте и покрыто пробами зоны: ошибиться в
      # нём (сказать «не уехало ничего» после публикации) легко, а заметить —
      # только на живом выпуске, то есть уже дорого.
      #
      # Состояний два, потому что после публикации падать могут две разные вещи:
      # запись в `main` (реестр ушёл вперёд репозитория) и приёмка (уехало всё,
      # репозиторий в курсе, а у потребителя выпуск не работает). По одному лишь
      # состоянию публикации они неразличимы — оно у обоих `success`.
      #
      # `cancelled()` тоже: снятый посреди публикации прогон оставляет ту же
      # неопределённость, что упавший, и промолчать здесь было бы хуже всего.
      - name: Отказ — что сейчас в реестре и что делать
        if: ${{ failure() || cancelled() }}
        run: node .github/scripts/release-refusal.mjs "${{ steps.publish.outcome }}" "${{ steps.push.outcome }}" >> "$GITHUB_STEP_SUMMARY"
