name: Release
# Ручной deliberate-publish (не авто-на-push). Реестр — публичный npm (kb:ADR-19),
# OIDC trusted publishing + provenance (kb:MECH-7). Требует настроенного на npmjs.com
# trusted publisher для scope @omnifield ↔ этот репо+workflow. Валидируется на Ф3.
on:
  workflow_dispatch:

permissions:
  contents: write   # commit версий/changelog + git tag
  id-token: write   # OIDC trusted publishing (без долгоживущего NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing требует npm >= 11.5.1 (node 22 несёт npm 10.x)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # build-before-publish ЯВНЫМ шагом, не через publish-хук (BASER-1 #1: dependsOn ненадёжен)
      - run: pnpm exec nx run-many -t build
      # version + changelog + publish; provenance по умолчанию при OIDC
      - run: pnpm exec nx release --yes
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - run: git push --follow-tags origin HEAD:main
