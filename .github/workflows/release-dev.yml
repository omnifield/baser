name: Release (dev)

# ДЕВ-КАНАЛ — отдельный поток с отдельными обещаниями (`kb:BASER3-9`): дев ничего
# не обещает, релиз обещает всё. Поэтому это отдельный файл рядом с `release.yml`,
# а не ветка внутри него: у каналов разные реестры, разные права, разные метки и
# разная цена ошибки, и ветвление внутри одного потока их бы перемешало.
#
# ЧТО ЭТОТ ПОТОК ЧИНИТ. До него дев-выпуск был руками: человек публиковал со своего
# девбокса, правом записи служил PAT с общего тома кредов, а адрес реестра вообще не
# был назван в репозитории — он был свойством машины (`tasker:BASER2-94`, вторая
# половина `tasker:BASER2-96`). Значит выпуск был возможен ровно с одной машины, и
# на любой другой уехал бы не туда, молча.
#
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ.
#   · Суждения о номерах. Старшинство, «назад не идёт» и «номер занят» судит гейт
#     `@omnifield/baser-release` — он стоит джобом на каждом PR (`ci.yml`), и
#     дублировать его здесь значило бы завести вторую правду о том же (BASER2-158).
#   · Provenance. Аттестат происхождения работает только на публичном npm и на
#     GitHub Packages не подтверждён ни одним источником (`kb:BASER3-19`).
#     Обещать его в дев-канале было бы враньём про канал.
#   · Подъёма версий. Номер на нулевых мажорах назначает человек и называет
#     причину: считалка там поднимает патч и фиче, и ломающему (BASER2-95).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Сухой прогон: посчитать и спросить реестр, но ничего не публиковать'
        type: boolean
        default: false

# АДРЕС РЕЕСТРА НАЗВАН ЗДЕСЬ — в репозитории, один раз, и дальше все шаги берут его
# отсюда. Раньше он жил в `npmrc` на общем томе кредов, то есть был свойством
# машины: на другой машине тот же выпуск уехал бы в другой реестр, и узналось бы
# это по факту. Метка `dev` названа рядом по той же причине — она половина схемы
# дев-номера (`kb:BASER3-20`), а не аргумент, который можно забыть.
env:
  DEV_REGISTRY: https://npm.pkg.github.com
  DEV_TAG: dev
  SCOPE: '@omnifield'

# ПРАВО ЗАПИСИ — КОНВЕЙЕРНОЕ. `GITHUB_TOKEN` этого прогона, а не долгоживущий PAT
# с общего тома: у прогона своё право, оно живёт минуты и не существует за
# пределами конвейера. Ключ `permissions` поднимает права токена до write ДАЖЕ
# когда репозиторная настройка по умолчанию read-only (сверено с доками GitHub
# Actions 2026-08-04, «Controlling permissions for GITHUB_TOKEN»; исключение —
# прогоны из форков, а `workflow_dispatch` из форка не запускается).
permissions:
  contents: write # теги выпуска — база сравнения для гейта номеров
  packages: write # запись в дев-реестр

# Два дев-выпуска разом — это гонка за один номер. Очередь, а не отмена: прогон,
# который уже мог что-то опубликовать, снимать посреди работы нельзя.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      # Вся история и теги: тег выпуска ставится этим же прогоном, и локальная
      # проверка «такого тега ещё нет» без них невозможна.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # `registry-url` + `scope` кладут адрес и токен в npmrc ПОЛЬЗОВАТЕЛЯ (HOME),
      # а не репозитория. Так же сделано в `ci.yml`, и по той же причине: npmrc в
      # корне репозитория виден каждой пробе, которая запускает npm из своей
      # фикстуры, и зона девбокса на нём краснеет — её проверки строят «реестр не
      # настроен» сами.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: ${{ env.DEV_REGISTRY }}
          scope: ${{ env.SCOPE }}

      # ────────────────────────────────────────────────────────────────────────
      # 1. Что уедет. Считает репозиторий, а не человек при запуске.
      # ────────────────────────────────────────────────────────────────────────
      - name: План выпуска — что уедет и что для этого обязано лежать в реестре
        run: |
          # План живёт вне рабочего дерева: он артефакт прогона, а не файл
          # репозитория, и лежать среди публикуемых каталогов ему нечего.
          plan="$RUNNER_TEMP/dev-release-plan.json"
          node .github/scripts/dev-release-plan.mjs > "$plan"
          echo "PLAN=$plan" >> "$GITHUB_ENV"

          {
            echo "## Дев-выпуск"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| канал | \`$DEV_TAG\` (метка выпуска, не \`latest\`) |"
            echo "| реестр | \`$DEV_REGISTRY\` |"
            echo "| право записи | \`GITHUB_TOKEN\` прогона |"
            echo "| источник | \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\` |"
            echo
            echo "### Уезжает"
            echo
            jq -r '.publish[] | "- `\(.name)@\(.version)`"' "$plan"
            echo

            # Придержанное — в summary, а не только в логе шага. Пакет с уже
            # выпущенным номером в набор не входит (`tasker:BASER2-168`), и
            # молчать об этом нельзя: молча выпавший неотличим от забытого —
            # человек, не поднявший номер, узнал бы об этом тем, что его правка
            # никуда не уехала.
            if [ "$(jq -r '.held | length' "$plan")" -gt 0 ]; then
              echo "### Не уезжает — номер уже выпускался"
              echo
              jq -r '.held[] | "- `\(.name)@\(.version)` — номер в манифесте не двинулся после выпуска"' "$plan"
              echo
              echo "> Занятый номер не переиспользуется (\`kb:BASER3-20\`). Если правка в этом пакете должна была уехать — подними ему номер."
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────────────
      # 2. Реестр спрашивается ДО публикации, а не ловится 409 после.
      #    Канон рынка (`kb:BASER3-19`): «проверка ПЕРЕД публикацией», а ловля
      #    «нельзя опубликовать поверх» постфактум названа там анти-паттерном.
      # ────────────────────────────────────────────────────────────────────────
      - name: Номер свободен, а цепочка уже в реестре
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Кэш свой и пустой: на свежем раннере он пуст и так, но тогда холод был
          # бы совпадением, а не свойством шага. Тот же приём, что у двери в
          # `tasker:BASER2-161`, и по той же причине — менеджер пакетов при
          # недоступном реестре отдаёт устаревшую запись вместо отказа.
          cold="$RUNNER_TEMP/precheck-cache"
          rm -rf "$cold"
          mkdir -p "$cold"

          failed=0

          # Ответ реестра сверяется ПО ЗНАЧЕНИЮ, а не по коду выхода: `npm view`
          # на несуществующем номере сегодня отвечает `1` (проверено на живом
          # реестре 2026-08-04, npm 10.9.8), но код выхода — свойство версии
          # менеджера, а напечатанный номер — свойство реестра.
          echo "Номер выпускаемого обязан быть СВОБОДЕН — номер это адрес содержимого:"
          while IFS=$'\t' read -r name version; do
            got=$(npm view "$name@$version" version --cache "$cold" 2> /dev/null || true)
            if [ "$got" = "$version" ]; then
              echo "::error::$name@$version уже лежит в реестре — занятый номер не переиспользуется (kb:BASER3-20). Подними номер."
              failed=1
            else
              echo "  · $name@$version — свободен"
            fi
          done < <(jq -r '.publish[] | "\(.name)\t\(.version)"' "$PLAN")

          echo "Соседи, на которых ссылается выпускаемое, обязаны УЖЕ БЫТЬ в реестре:"
          while IFS=$'\t' read -r name version needed; do
            got=$(npm view "$name@$version" version --cache "$cold" 2> /dev/null || true)
            if [ "$got" = "$version" ]; then
              echo "  · $name@$version — на месте (нужен $needed)"
            else
              echo "::error::$name@$version в реестре нет, а $needed на него ссылается. Ссылка workspace:* превратится при публикации в точный номер, и у потребителя установка развалится на соседе, а не на нас."
              failed=1
            fi
          done < <(jq -r '.requires[] | "\(.name)\t\(.version)\t\(.neededBy)"' "$PLAN")

          echo "Тега выпуска ещё нет:"
          while IFS=$'\t' read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::тег $tag уже стоит в репозитории — этот номер уже выпускался"
              failed=1
            else
              echo "  · $tag — свободен"
            fi
          done < <(jq -r '.publish[].tag' "$PLAN")

          exit $failed

      # ────────────────────────────────────────────────────────────────────────
      # 3. Готовность — ТА ЖЕ ОДНА команда, что в `ci.yml` и у вахтёра на выходе:
      #    `pnpm verify` (разбор — в `ci.yml`, `tasker:BASER2-191`). Выпуску это
      #    нужно не меньше приёмки: уезжает в реестр то, что собрано здесь, и
      #    вердикт «готово» обязан значить одно и то же на обоих потоках.
      #    Пробы зоны `git` — той самой, чей скрипт посчитал план выше — бегут
      #    внутри этой команды (`tasker:BASER2-167`), отдельного шага им не надо.
      #    Собранное не коммитим и не переиспользуем — публикуется свежесобранное
      #    этим прогоном (`kb:BASER3-19`, анти-паттерны).
      # ────────────────────────────────────────────────────────────────────────
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm verify

      # ────────────────────────────────────────────────────────────────────────
      # 4. Публикация.
      # ────────────────────────────────────────────────────────────────────────
      - name: Сухой прогон — в реестр не уехало ничего
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "> **СУХОЙ ПРОГОН.** Всё посчитано и проверено, в реестр не уехало ничего."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Сухой прогон: публикация пропущена."

      - name: Публикация — pnpm, метка dev
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `pnpm publish`, а НЕ `npm publish`: второй оставляет в манифесте
          # `workspace:*`, и пакет не устанавливается вовсе. Поймано на живом
          # выпуске; что подмена сработала, проверяется шагом 5 по манифесту
          # ПОСТАВЛЕННОГО пакета, а не доверием к менеджеру.
          #
          # `--no-git-checks` — потому что раннер стоит на отсоединённой голове, и
          # проверки pnpm «ветка та и дерево чистое» здесь неприменимы, а не
          # потому, что они мешают: дерево тут ровно то, что дал checkout.
          #
          # Адрес реестра НЕ передаётся флагом — он назван один раз в `env` и лежит
          # в npmrc, который положил `setup-node`. Флагом было бы два места, где
          # написан адрес, и разошлись бы они молча.
          while IFS=$'\t' read -r name version dir; do
            echo "::group::$name@$version"
            (cd "$dir" && pnpm publish --tag "$DEV_TAG" --no-git-checks)
            echo "::endgroup::"
          done < <(jq -r '.publish[] | "\(.name)\t\(.version)\t\(.dir)"' "$PLAN")

          {
            echo "### Опубликовано"
            echo
            jq -r --arg tag "$DEV_TAG" '.publish[] | "- `\(.name)@\(.version)` под меткой `\($tag)`"' "$PLAN"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Тег — не украшение: `<имя>@<номер>` это база сравнения гейта выпуска. Он
      # судит монотонность против ЛЮБОГО тега, включая предвыпускной, а цену
      # изменения мерит от последнего стабильного (`lib/guard.mjs`) — то есть
      # дев-теги он ждёт. Без них правило «занятый номер не переиспользуется»
      # держалось бы только реестром, а гейт на PR его не увидел бы.
      #
      # Ставится СРАЗУ после публикации, до проверки установки: номер уже занят
      # содержимым, и это факт независимо от того, зелёной ли будет проверка.
      - name: Тег выпуска
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tags=()
          while IFS=$'\t' read -r tag name version; do
            git tag -a "$tag" -m "дев-выпуск $name@$version в $DEV_REGISTRY под меткой $DEV_TAG, из $GITHUB_REF_NAME @ $GITHUB_SHA"
            tags+=("refs/tags/$tag")
          done < <(jq -r '.publish[] | "\(.tag)\t\(.name)\t\(.version)"' "$PLAN")

          git push origin "${tags[@]}"

          {
            echo "### Теги"
            echo
            jq -r '.publish[] | "- `\(.tag)`"' "$PLAN"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────────────
      # 5. ПРОВЕРКА НА ХОЛОДНОМ КЭШЕ. Условие приёмки, добытое на `BASER2-161`.
      #
      # Пакетный менеджер держит свой HTTP-кэш ответов реестра и при недоступном
      # или неспрошенном реестре отдаёт устаревшую запись ВМЕСТО ОТКАЗА — то есть
      # на прогретом кэше установка может пройти, не сходив в реестр вовсе.
      # Тогда «поставили — встало» доказательством не является: проверяется
      # фантом, пакет, которого в реестре может не быть.
      #
      # Здесь холод — свойство шага, а не удача: каталог кэша создаётся пустым
      # НА КАЖДЫЙ пакет, поэтому ответить из кэша нечем по построению, и всё, что
      # в нём оказалось, пришло из реестра этим же шагом.
      #
      # Проверяется РЕЕСТР, а не вывод публикации (`kb:BASER3-20`): оба факта —
      # номер и метка — наблюдаемы снаружи и не требуют доверия к тому, кто
      # публиковал.
      # ────────────────────────────────────────────────────────────────────────
      - name: Проверка из реестра на холодном кэше
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          host="${DEV_REGISTRY#https://}"
          failed=0
          nth=0

          {
            echo "### Проверено из реестра, кэш холодный"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r name version; do
            nth=$((nth + 1))
            cold="$RUNNER_TEMP/cold-$nth"
            rm -rf "$cold"
            mkdir -p "$cold/cache" "$cold/project"

            # Адрес реестра — из `env` этого воркфлоу, а не из окружения раннера:
            # проверка обязана ходить туда же, куда уехала публикация, и это
            # должно быть видно здесь, а не подразумеваться.
            printf '%s:registry=%s\n' "$SCOPE" "$DEV_REGISTRY" > "$cold/project/.npmrc"
            printf '//%s/:_authToken=${NODE_AUTH_TOKEN}\n' "$host" >> "$cold/project/.npmrc"
            printf '{"name":"cold-check","version":"0.0.0","private":true}\n' > "$cold/project/package.json"

            echo "::group::$name@$version"
            if (
              set -e
              cd "$cold/project"

              echo "— номер в реестре"
              got=$(npm view "$name@$version" version --cache "$cold/cache")
              test "$got" = "$version"

              echo "— метка dev стоит на нём, latest НЕ на нём"
              tags=$(npm view "$name" dist-tags --json --cache "$cold/cache")
              echo "$tags"
              echo "$tags" | jq -e --arg v "$version" '.dev == $v'
              echo "$tags" | jq -e --arg v "$version" '.latest != $v'

              echo "— установка из реестра"
              npm install --cache "$cold/cache" --no-audit --no-fund "$name@$version"

              echo "— встало то, что выпускали, и workspace:* в манифест не утёк"
              jq -e --arg v "$version" '.version == $v' "node_modules/$name/package.json"
              jq -e '[(.dependencies // {})[] | select(startswith("workspace:"))] | length == 0' \
                "node_modules/$name/package.json"
            ); then
              echo "- \`$name@$version\` — номер в реестре, метка \`$DEV_TAG\`, \`latest\` не сдвинут, установка на холодном кэше прошла" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name@$version — проверка из реестра на холодном кэше не прошла"
              echo "- \`$name@$version\` — **проверка не прошла**" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.publish[] | "\(.name)\t\(.version)"' "$PLAN")

          echo >> "$GITHUB_STEP_SUMMARY"
          exit $failed
