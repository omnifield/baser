name: PR title

# ОТДЕЛЬНЫЙ ФАЙЛ — ИЗ-ЗА СОБЫТИЙ, А НЕ ИЗ-ЗА ОПРЯТНОСТИ.
#
# Типы событий задаются на ВЕСЬ workflow, а не на задачу. Гейт заголовка обязан
# перезапускаться на правку заголовка (`edited`) — иначе человек, исправивший его
# по подсказке гейта, зелёного не получит и будет искать, чем перезапустить
# (`tasker:BASER2-184`). Дописать `edited` в `ci.yml` значило бы гонять на каждую
# правку заголовка И тяжёлую задачу `main` — установку, сборку и все пробы.
# Значит у гейта своё событие, а у него — свой файл.
#
# `synchronize` здесь ОБЯЗАТЕЛЕН, и это не дубль. Проверка привязана к SHA: на
# новом пуше у нового коммита проверки этого имени нет вовсе, и обязательный
# контекст держал бы PR закрытым навсегда. Ровно эта грабля описана у готового
# действия (см. ниже).
#
# СВЕРКА С РЫНКОМ (2026-08-05). Смотрел `amannn/action-semantic-pull-request` —
# де-факто стандарт для conventional-заголовка на сквош-мерже. Нашёл: рекомендует
# ОТДЕЛЬНЫЙ workflow с ровно этим набором типов (`opened`, `reopened`, `edited`,
# `synchronize`) и прямо предупреждает, что без `synchronize` обязательная
# проверка не переедет на новый пуш. Форму берём — она сходится с нашим разбором.
# Само действие НЕ берём: наше правило строже спецификации (зона обязательна — по
# ней видно, чьё изменение), подсказка на русском и называет наши зоны, а джоб
# гейта держится zero-deps намеренно. Тянуть стороннее действие ради `grep`,
# который у нас уже есть и покрыт пробами, — плата правами и цепочкой поставки
# без выигрыша.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Заголовок берётся из полезной нагрузки события — ни репозитория, ни API гейту
# не нужно. Право на чтение содержимого нужно только шагу `checkout`.
permissions:
  contents: read

jobs:
  # ИМЯ ЗАДАЧИ = ИМЯ ОБЯЗАТЕЛЬНОГО КОНТЕКСТА в ruleset'е `omnifield-git-flow`.
  # Переименуешь — контекст в правиле влития перестанет находиться, и гейт молча
  # выключится: PR будет вливаться, не дождавшись проверки, которой нет.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Правило — код с пробами (`scripts/pr-title.spec.mjs`), а не строка в
      # YAML: YAML проверяет только живой прогон, то есть уже после ошибки.
      # Установки зависимостей здесь нет и не будет — отсюда секунды гейта.
      #
      # Заголовок идёт ПЕРЕМЕННОЙ ОКРУЖЕНИЯ. Подстановка `${{ }}` в текст команды
      # склеила бы заголовок PR с телом скрипта — это выполнение команд на нашем
      # раннере по воле автора PR.
      - name: Заголовок PR — по Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/pr-title.mjs
